[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "data", "evaluation/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
